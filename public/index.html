<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ask your documents</title>
<style>
  :root { --bg1: #e6f3e8; --bg2: #fbe9e7; --ink: #22332a; --muted: #5d7266; --card: #ffffff; --line: #cfe2d3; --accent: #c0392b; --ok: #2e7d4f; }
  @media (prefers-color-scheme: dark) { :root { --bg1: #14211a; --bg2: #271a19; --ink: #e8efe9; --muted: #98aa9e; --card: #1b2a21; --line: #2d4136; --accent: #e8766a; --ok: #62c58a; } }
  * { box-sizing: border-box; }
  html { background: var(--bg2); }
  body { margin: 0; min-height: 100vh; background: var(--bg1); background: linear-gradient(160deg, var(--bg1) 0%, var(--bg2) 100%); color: var(--ink); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 32px 16px 64px; }
  h1 { font-size: 28px; margin: 0 0 4px; }
  .lede { color: var(--muted); margin: 0 0 20px; }
  .info { font-size: 13px; color: var(--muted); margin-bottom: 20px; }
  form { display: flex; gap: 8px; }
  input { flex: 1; min-width: 0; padding: 12px 14px; border: 1.5px solid var(--line); border-radius: 10px; background: var(--card); color: var(--ink); font: inherit; }
  input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  button { padding: 12px 18px; border: 0; border-radius: 10px; background: var(--accent); color: #fff; font: inherit; font-weight: 700; cursor: pointer; }
  button:disabled { opacity: .6; cursor: wait; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 14px 0 24px; }
  .chip { padding: 6px 12px; border: 1px solid var(--line); border-radius: 999px; background: var(--card); color: var(--ink); font-weight: 500; font-size: 14px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 18px 20px; margin-top: 16px; }
  .answer { white-space: pre-wrap; }
  .badge { display: inline-block; font-size: 12px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; padding: 2px 8px; border-radius: 6px; margin-bottom: 8px; background: color-mix(in srgb, var(--ok) 16%, transparent); color: var(--ok); }
  .badge.refused { background: color-mix(in srgb, var(--accent) 16%, transparent); color: var(--accent); }
  h2 { font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 22px 0 6px; }
  .src { border-top: 1px solid var(--line); padding: 10px 0; font-size: 14px; }
  .src:first-of-type { border-top: 0; }
  .src b { color: var(--accent); }
  .src .meta { color: var(--muted); font-size: 12px; }
  .src p { margin: 4px 0 0; color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1 id="name">Ask your documents</h1>
  <p class="lede" id="subtitle"></p>
  <div class="info" id="info">loading…</div>
  <form id="f">
    <input id="q" maxlength="300" placeholder="Type a question about your documents" autocomplete="off" required>
    <button id="go">Ask</button>
  </form>
  <div class="chips" id="chips"></div>
  <div id="out"></div>
</main>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
$('chips').addEventListener('click', (e) => { if (e.target.classList.contains('chip')) { $('q').value = e.target.textContent; $('f').requestSubmit(); } });

fetch('/api/info').then((r) => r.json()).then((i) => {
  if (i.name) { $('name').textContent = i.name; document.title = i.name; }
  $('subtitle').textContent = i.subtitle || '';
  const ex = i.examples || [];
  $('chips').innerHTML = ex.map((e) => `<button type="button" class="chip">${esc(e)}</button>`).join('');
  $('q').placeholder = ex[0] ? 'Example: ' + ex[0] : 'Type a question about your documents';
  $('info').textContent = `${i.documents} documents · ${i.chunks} passages · embedding: ${i.embedder} · search: ${i.search} · answers: ${i.answerModel ?? 'no model (best passage only)'}`;
});

$('f').addEventListener('submit', async (e) => {
  e.preventDefault();
  $('go').disabled = true;
  $('out').innerHTML = '<div class="card">Searching…</div>';
  try {
    const res = await fetch('/api/ask', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ question: $('q').value }) });
    const d = await res.json();
    if (!res.ok) throw new Error(d.error || 'Failed');
    const label = { llm: 'Answer from the model', extractive: 'Most relevant passage', refused: 'Not in the documents' }[d.mode];
    const via = { meaning: 'meaning', keyword: 'keyword', both: 'meaning + keyword' };
    $('out').innerHTML = `<div class="card"><span class="badge ${d.mode === 'refused' ? 'refused' : ''}">${label}</span><div class="answer">${esc(d.answer)}</div>` +
      (d.sources.length ? `<h2>Sources</h2>` + d.sources.map((s) => `<div class="src"><b>[${s.n}]</b> ${esc(s.doc)}${s.page ? ' · page ' + s.page : ' › ' + esc(s.heading)} <span class="meta">score ${s.score} · found by ${via[s.via]}</span><p>${esc(s.text)}</p></div>`).join('') : '') + '</div>';
  } catch (err) {
    $('out').innerHTML = `<div class="card">${esc(err.message)}</div>`;
  } finally {
    $('go').disabled = false;
  }
});
</script>
</body>
</html>
