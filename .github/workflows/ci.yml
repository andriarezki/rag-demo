name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Retrieval eval (offline hash embedder)
        run: |
          DB_FILE=/tmp/ci.db npm run ingest
          DB_FILE=/tmp/ci.db npm run eval
